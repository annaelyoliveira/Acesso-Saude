spring.application.name=acessosaude

spring.datasource.url=jdbc:postgresql://localhost:5432/cnes_pb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 1. Impede o Hibernate de forçar nomes para minúsculo ou snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 2. Garante que o Hibernate não tente "adivinhar" nomes de colunas
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
